# On every PR and on main: typecheck, unit tests and lint in `check`; the whole end-to-end suite (tmux + fake Claude Code, auto mode in
# Linux's real sandbox) in `e2e`; macOS's sandbox tests in `sandbox-mac`.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25 # node:sqlite and --experimental-strip-types, as HQ runs locally
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat tmux
      - run: npm ci
      - name: Backend typecheck
        run: npm --workspace @hq/backend run typecheck
      - name: Backend lint
        run: npm --workspace @hq/backend run lint -- --deny-warnings
      - name: Backend unit tests
        run: npm --workspace @hq/backend test
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Frontend lint
        run: npm --workspace frontend run lint -- --deny-warnings
      - name: No new lines over 200 characters
        run: node scripts/long-lines.mjs
      - name: No new fixed waits in tests
        run: node scripts/fixed-waits.mjs
      - name: Every tmux call names its socket
        run: node scripts/tmux-socket.mjs
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat tmux
      - run: npm ci
      - name: Build the page
        run: npm --workspace frontend run build # e2e/build.test.ts reads frontend/dist
      - name: End-to-end suite
        working-directory: backend
        # Bug 113: once every test had ended, a test file never exited and held the job 16 minutes, with the failure's details unprinted. --test-force-exit
        # (in the npm script) ends each file when its tests are done; the harness itself fails a test whose HQ leaves its output held. The step limit is the
        # backstop (a normal run takes about 4 min on Linux).
        timeout-minutes: 20
        run: npm run e2e
  sandbox-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - name: A real terminal after a fresh install
        run: node -e "const p=require('node-pty').spawn('/bin/echo',['ok'],{});p.onExit(({exitCode})=>process.exit(exitCode))"
      - name: Sandbox tests
        working-directory: backend
        run: node --experimental-strip-types --test --test-timeout=60000 --test-force-exit src/testrun.test.ts src/uitester.test.ts # the UI tester's host and lockdown (its browser test skips: no browser)
